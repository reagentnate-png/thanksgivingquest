<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanksgiving Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b1d1d; --cream:#fbf5e4; --paper:#fffdf3; --line:#a8c4e6;
    --red:#d63a3a; --orange:#d9772b; --gold:#f5c542; --green:#4caf50;
    --pix:'Press Start 2P', ui-monospace, monospace;
    --hand:'Caveat', 'Comic Sans MS', cursive;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#2a1a12 radial-gradient(circle at 50% 30%, #4a2b1a 0%, #2a1a12 70%);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--pix);color:var(--ink);
    -webkit-tap-highlight-color:transparent; overflow:hidden;
  }
  .stage{
    position:relative; width:min(96vw, 760px); aspect-ratio:4/3; max-height:96vh;
    background:var(--cream); border:6px solid var(--ink); border-radius:10px;
    box-shadow:0 0 0 6px #7a4a2a, 0 20px 60px rgba(0,0,0,.6);
    overflow:hidden; overflow:clip; user-select:none; font-size:clamp(9px, 1.9vmin, 15px);
  }
  @supports not (aspect-ratio:4/3){ .stage{height:72vw;max-height:570px} }
  .scene{position:absolute; inset:0; display:none; overflow:hidden; overflow:clip}
  .scene.on{display:block}
  svg.px{display:block;width:100%;height:auto;image-rendering:pixelated}
  button{font-family:var(--pix);cursor:pointer}

  /* ---------- Title ---------- */
  #title{background:linear-gradient(#f7d9a0, #e9a65a 60%, #b8612b); text-align:center; cursor:pointer}
  #title .leaves{position:absolute;inset:0;pointer-events:none}
  #title .leaf{position:absolute;top:-10%;font-size:1.8em;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}
  #title h1{margin:0;position:absolute;top:16%;left:0;right:0;font-size:2.6em;line-height:1.4;color:#fff;
    text-shadow:4px 4px 0 var(--ink), -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink)}
  #title h1 small{display:block;font-size:.42em;color:var(--gold);margin-top:.6em}
  #title .bird{position:absolute;top:45%;left:50%;transform:translateX(-50%);font-size:5em;animation:bob 1s steps(2) infinite}
  #title .start{position:absolute;bottom:14%;left:0;right:0;font-size:1.2em;color:#fff;text-shadow:2px 2px 0 var(--ink);animation:blink 1s steps(1) infinite}
  #title .copy{position:absolute;bottom:4%;left:0;right:0;font-size:.7em;color:#5a2b10}
  @keyframes blink{50%{opacity:0}}
  @keyframes bob{50%{transform:translate(-50%,-6px)}}

  /* ---------- Battle / door scene ---------- */
  .field{position:absolute;left:0;right:0;top:0;height:70%;
    background:linear-gradient(#fbf3dc 0 52%, #efe2b4 52% 100%); overflow:hidden}
  .house{position:absolute;right:0;top:0;width:52%;height:58%;background:
    repeating-linear-gradient(#e7c79a 0 10px, #d9b685 10px 12px); border-left:4px solid var(--ink);border-bottom:4px solid var(--ink)}
  .door{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:36%;height:86%;background:#7a3f1d;border:4px solid var(--ink);border-bottom:none}
  .door::before{content:'';position:absolute;inset:10% 14% 50% 14%;border:3px solid #5a2b10}
  .door::after{content:'';position:absolute;right:12%;top:55%;width:8%;aspect-ratio:1;background:var(--gold);border:2px solid var(--ink);border-radius:50%}
  .wreath{position:absolute;left:6%;top:14%;font-size:2em}
  .enemy{position:absolute;right:8%;top:4%;width:30%}
  .player{position:absolute;left:5%;bottom:-2%;width:36%}
  .plat{position:absolute;left:-12%;right:-12%;bottom:-6%;height:24%;border-radius:50%;background:#d7c27a;border:4px solid #a8934a}
  .player .plat{bottom:4%}
  .spr{position:relative;width:62%;margin:0 auto}
  .enemy .spr{animation:idle 1.2s steps(2) infinite}
  @keyframes idle{50%{transform:translateY(-2px)}}
  .entered .enemy{animation:inL .9s steps(8) both}
  .entered .player{animation:inR .9s steps(8) both}
  @keyframes inL{from{transform:translateX(-260%)}}
  @keyframes inR{from{transform:translateX(320%)}}
  .shake{animation:shake .4s steps(4) !important}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .bang{position:absolute;top:-22%;right:-4%;font-size:2.4em;color:var(--red);text-shadow:2px 2px 0 var(--ink);display:none}
  .bang.on{display:block;animation:pop .3s steps(3)}
  @keyframes pop{from{transform:scale(0)}}
  .held{position:absolute;left:0;right:0;bottom:12%;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:2em;pointer-events:none}
  .held span{animation:pop .3s steps(3) both;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}

  .infobox{position:absolute;background:var(--paper);border:4px solid var(--ink);border-radius:6px 6px 6px 18px;padding:.7em .9em .6em;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
  .infobox .nm{text-transform:uppercase;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72%}
  .infobox .lv{position:absolute;right:.9em;top:.7em}
  .barrow{display:flex;align-items:center;gap:.5em;margin-top:.7em;font-size:.7em}
  .barrow span{background:var(--ink);color:var(--gold);padding:.25em .4em;border-radius:3px}
  .bar{flex:1;height:.9em;border:3px solid var(--ink);border-radius:5px;background:#fff;overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:var(--green);transition:width .8s steps(12), background .3s}
  .bar i.mid{background:var(--gold)} .bar i.low{background:var(--red)}
  .enemy-box{left:3%;top:6%;width:44%}
  .player-box{right:3%;bottom:6%;width:46%}
  .hptext{text-align:right;margin-top:.5em;font-size:.8em}

  /* ---------- Textbox ---------- */
  .textbox{position:absolute;left:0;right:0;bottom:0;height:30%;background:var(--paper);
    border-top:4px solid var(--ink);padding:1em 1.3em;display:none;z-index:5}
  .textbox.on{display:block}
  .textbox::before{content:'';position:absolute;inset:6px;border:3px solid #6aa0d8;border-radius:6px;pointer-events:none}
  .speaker{position:absolute;top:-1.9em;left:1em;background:var(--ink);color:var(--gold);padding:.45em .7em;border-radius:4px 4px 0 0;text-transform:uppercase;font-size:.85em}
  .txt{line-height:1.9;font-size:1.05em;min-height:3.8em;white-space:pre-wrap}
  .next{position:absolute;right:1.3em;bottom:.9em;display:none;animation:blink .7s steps(1) infinite;color:var(--red)}
  .textbox.ready .next{display:block}
  .namefield{display:flex;gap:.6em;margin-top:.4em}
  .namefield[hidden]{display:none}
  .namefield input{flex:1;font-family:var(--pix);font-size:1em;padding:.5em;border:3px solid var(--ink);border-radius:4px;background:#fff;text-transform:uppercase;min-width:0}
  .btn{background:var(--red);color:#fff;border:3px solid var(--ink);border-radius:4px;padding:.6em .9em;font-size:.9em;box-shadow:3px 3px 0 var(--ink)}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn[hidden]{display:none}
  .walkin{position:absolute;right:1.2em;bottom:.9em;animation:bob2 .8s steps(2) infinite}
  @keyframes bob2{50%{transform:translateX(4px)}}

  /* ---------- First-person list ---------- */
  #list{background:
      linear-gradient(rgba(40,20,10,.35), rgba(40,20,10,.55)),
      repeating-linear-gradient(90deg, #8a5532 0 46px, #7a4a2a 46px 50px)}
  #list .doorframe{position:absolute;left:10%;right:10%;top:-4%;bottom:30%;background:#6b3818;border:6px solid var(--ink);filter:blur(1.5px);opacity:.7}
  .paper{position:absolute;left:9%;right:9%;top:4%;bottom:16%;background:
      linear-gradient(90deg, transparent 2.6em, #f2a7a7 2.6em 2.8em, transparent 2.8em),
      repeating-linear-gradient(var(--paper) 0 1.85em, var(--line) 1.85em calc(1.85em + 1px));
    border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.5);transform:rotate(-1.2deg);
    padding:1.2em 1.2em 4.5em 3.4em;overflow-y:auto;overscroll-behavior:contain;font-family:var(--hand)}
  .paper.shake{animation:shake .4s steps(4)}
  .paper h2{font-family:var(--hand);font-size:2.3em;margin:0;line-height:1;color:#1d3a6e}
  .paper .sub{margin:.15em 0 .5em;font-size:1.5em;color:#7a2f2f}
  .items{list-style:none;margin:0;padding:0;columns:2;column-gap:1.6em}
  .item{position:relative;break-inside:avoid;width:fit-content;max-width:100%;font-size:1.65em;line-height:1.12;padding:.08em .3em;cursor:pointer;color:#1d2b4f;border-radius:30px;margin-bottom:.06em}
  .item:hover{background:rgba(214,58,58,.07)}
  .item .em{display:inline-block;width:1.4em;font-size:.85em}
  .item .slots{font-size:.7em;color:#6b7aa0;margin-left:.3em}
  .item .by{display:block;font-size:.72em;color:#8a6a4a;margin-left:1.7em;line-height:1}
  .item.taken{cursor:not-allowed}
  .item.taken .lbl{text-decoration:line-through;text-decoration-thickness:2px;color:#8a8a99}
  .item svg.circ{position:absolute;left:-.25em;top:-.18em;width:calc(100% + .5em);height:calc(100% + .36em);pointer-events:none;overflow:visible}
  .item svg.circ path{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .writein{display:block;font-size:1.6em;margin-top:.5em;color:#1d2b4f}
  .writein input{font-family:var(--hand);font-size:1em;border:none;border-bottom:2px dashed #1d3a6e;background:transparent;width:60%;color:#b52a2a;outline:none}
  .hand{position:absolute;bottom:-3%;width:17%;pointer-events:none;z-index:3;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
  .hand.l{left:4%;transform:rotate(14deg)}
  .hand.r{right:4%;transform:scaleX(-1) rotate(14deg)}
  .listbar{position:absolute;left:24%;right:24%;bottom:2.5%;display:flex;align-items:center;justify-content:space-between;gap:.6em;z-index:4}
  .listbar .count{color:#fff;text-shadow:2px 2px 0 var(--ink);font-size:.85em}
  .toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:1em 1.2em;border-radius:6px;line-height:1.7;text-align:center;z-index:9;max-width:80%;display:none;font-size:.9em;border:3px solid var(--gold)}
  .toast.on{display:block;animation:pop .2s steps(3)}

  /* ---------- Inside ---------- */
  #inside .room{position:absolute;inset:0 0 30% 0;background:linear-gradient(#c96b3a 0 62%, #8a4a22 62%);overflow:hidden}
  #inside .wallpaper{position:absolute;inset:0 0 38% 0;background:repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 14px, transparent 14px 28px)}
  #inside .win{position:absolute;top:8%;width:16%;height:34%;background:linear-gradient(#ffcf7a,#f08a3c);border:4px solid var(--ink);box-shadow:inset 0 0 0 4px #fff3d6}
  #inside .win.a{left:8%} #inside .win.b{right:8%}
  #inside .table{position:absolute;left:12%;right:12%;bottom:12%;height:26%;background:#fff;border:4px solid var(--ink);border-radius:8px;
    background-image:repeating-linear-gradient(90deg, #f6e1c2 0 18px, #fff 18px 36px)}
  #inside .food{position:absolute;left:0;right:0;top:-38%;display:flex;justify-content:space-around;font-size:2.3em}
  #inside .food span{animation:idle 1.4s steps(2) infinite}
  #inside .food span:nth-child(2n){animation-delay:.3s}
  #inside .fam{position:absolute;left:4%;right:4%;bottom:46%;display:flex;justify-content:space-between;font-size:2em;opacity:.95}
  .menu{position:absolute;right:3%;bottom:33%;background:var(--paper);border:4px solid var(--ink);border-radius:6px;padding:.7em .5em;z-index:6;display:none;box-shadow:4px 4px 0 rgba(0,0,0,.3)}
  .menu.on{display:block;animation:pop .2s steps(3)}
  .menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:.65em 1em .65em 2em;font-size:1em;position:relative;color:var(--ink)}
  .menu button.sel::before{content:'▶';position:absolute;left:.5em;color:var(--red)}
  .menu button small{display:block;font-size:.6em;color:#8a6a4a;margin-top:.4em}

  /* ---------- Done ---------- */
  #done{background:linear-gradient(#3a6ea5,#244a75);color:#fff}
  .card{position:absolute;left:8%;right:8%;top:8%;bottom:8%;background:var(--paper);color:var(--ink);border:5px solid var(--ink);border-radius:10px;padding:1.4em 1.6em;overflow:auto;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
  .card h2{margin:0 0 .3em;font-size:1.3em;color:var(--red)}
  .card .row{display:flex;gap:1em;margin:.9em 0;line-height:1.7}
  .card .k{width:7.5em;flex:none;color:#8a6a4a;font-size:.8em;padding-top:.2em}
  .card .v{font-family:var(--hand);font-size:1.9em;line-height:1.05}
  .card .status{font-size:.75em;line-height:1.8;margin-top:1em;padding:.8em;border:3px dashed #a8934a;border-radius:6px}
  .card .actions{margin-top:1.2em;display:flex;gap:.8em;flex-wrap:wrap}

  .mute{position:absolute;top:8px;right:8px;z-index:20;background:rgba(255,255,255,.85);border:3px solid var(--ink);border-radius:4px;font-size:.75em;padding:.4em .5em}
  @media (max-width:520px){ .items{columns:1} .listbar{left:20%;right:20%} }
  @media (orientation:portrait) and (max-width:700px){
    .stage{aspect-ratio:9/15; font-size:clamp(9px, 2.6vw, 13px)}
    .field, #inside .room{height:74%; bottom:auto}
    #inside .room{inset:0 0 26% 0}
    .textbox{height:26%}
    .house{width:64%;height:46%}
    .enemy{width:40%;right:12%}
    .player{width:52%;bottom:-1%}
    .enemy-box{top:50%;left:auto;right:3%;width:58%}
    .player-box{bottom:auto;top:66%;right:3%;width:52%}
    .player-box .hptext{display:none}
    .paper{left:5%;right:5%;bottom:13%}
    .hand{width:24%}
    .menu{bottom:29%;left:6%;right:6%}
  }
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important} }
</style>
</head>
<body>
<div class="stage" id="stage">
  <button class="mute" id="mute" aria-label="Toggle sound">♪ ON</button>

  <!-- TITLE -->
  <section class="scene on" id="title">
    <div class="leaves" id="leaves"></div>
    <h1>THANKSGIVING<br>QUEST<small id="yearLine"></small></h1>
    <div class="bird">🦃</div>
    <div class="start">▶ PRESS START</div>
    <div class="copy" id="copyLine"></div>
  </section>

  <!-- FRONT DOOR (battle style) -->
  <section class="scene" id="battle">
    <div class="field">
      <div class="house"><div class="door"></div><div class="wreath">🍂</div></div>
      <div class="infobox enemy-box">
        <div class="nm" id="enemyName"></div><div class="lv">Lv67</div>
        <div class="barrow"><span>PATIENCE</span><div class="bar"><i id="patBar"></i></div></div>
      </div>
      <div class="enemy"><div class="plat"></div><div class="spr" id="auntSpr"><div class="bang" id="bang">!</div></div></div>
      <div class="player"><div class="plat"></div><div class="spr" id="playerSpr"></div><div class="held" id="held"></div></div>
      <div class="infobox player-box">
        <div class="nm" id="playerName">???</div><div class="lv" id="playerLv">Lv1</div>
        <div class="barrow"><span>HUNGER</span><div class="bar"><i id="hungerBar"></i></div></div>
        <div class="hptext" id="hpText">ITEMS: 0</div>
      </div>
    </div>
  </section>

  <!-- FIRST PERSON LIST -->
  <section class="scene" id="list">
    <div class="doorframe"></div>
    <div class="paper" id="paper">
      <h2 id="listTitle"></h2>
      <p class="sub" id="listSub"></p>
      <ul class="items" id="itemList"></ul>
      <label class="writein">Something else: <input id="writeIn" maxlength="60" placeholder="________"></label>
    </div>
    <div class="hand l" id="handL"></div>
    <div class="hand r" id="handR"></div>
    <div class="listbar">
      <span class="count" id="selCount">0 CIRCLED</span>
      <button class="btn" id="doneBtn">HAND IT BACK ▶</button>
    </div>
  </section>

  <!-- INSIDE -->
  <section class="scene" id="inside">
    <div class="room">
      <div class="wallpaper"></div>
      <div class="win a"></div><div class="win b"></div>
      <div class="fam"><span>👵</span><span>👴</span><span>🧔</span><span>👩</span><span>🧒</span><span>🐕</span></div>
      <div class="table"><div class="food" id="tableFood"></div></div>
    </div>
    <div class="menu" id="menu">
      <button data-v="First Table">FIRST TABLE<small>Front of the line, plate piled high</small></button>
      <button data-v="Second Round">SECOND ROUND<small>Patient. Strategic. Seconds.</small></button>
      <button data-v="Doggie Bag">DOGGIE BAG<small>Grab food, leave family in rage</small></button>
    </div>
  </section>

  <!-- DONE -->
  <section class="scene" id="done">
    <div class="card" id="card">
      <h2>★ QUEST COMPLETE ★</h2>
      <div class="row"><div class="k">TRAINER</div><div class="v" id="cName"></div></div>
      <div class="row"><div class="k">BRINGING</div><div class="v" id="cItems"></div></div>
      <div class="row"><div class="k">GAME PLAN</div><div class="v" id="cSeat"></div></div>
      <div class="status" id="cStatus">Saving your quest…</div>
      <div class="actions"><button class="btn" id="againBtn">↺ CHANGE MY ANSWERS</button></div>
    </div>
  </section>

  <!-- Shared textbox -->
  <div class="textbox" id="textbox">
    <div class="speaker" id="speaker" hidden></div>
    <div class="txt" id="txt"></div>
    <form class="namefield" id="nameForm" hidden>
      <input id="nameInput" maxlength="24" autocomplete="off" placeholder="YOUR NAME" aria-label="Your name">
      <button class="btn" type="submit">OK</button>
    </form>
    <button class="btn walkin" id="walkBtn" hidden>WALK IN ▶</button>
    <div class="next">▼</div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* =====================================================================
   CONFIG — edit this part
   ===================================================================== */
const CONFIG = {
  // Paste your Google Apps Script web-app URL here (see README).
  // Leave empty to run in demo mode (answers are only kept in this browser).
  SUBMIT_URL: "https://script.google.com/macros/s/AKfycbxjJ4FwLHVvsj9tCRR-yY-0646dUvI6MYxH6FSncRvpDYFaTo0tVv2G3HQEsNJbRwcY/exec",

  GUARD_NAME: "Aunt Serdah",        // who's guarding the front door
  YEAR: 2026,
  FAMILY: "The Richards Family",

  // id must be unique. slots = how many people can claim it.
  ITEMS: [
    { id:"turkey",    name:"The Turkey",            emoji:"🦃", slots:1 },
    { id:"ham",       name:"Ham",                   emoji:"🍖", slots:1 },
    { id:"mashed",    name:"Mashed Potatoes",       emoji:"🥔", slots:1 },
    { id:"stuffing",  name:"Stuffing",              emoji:"🍞", slots:1 },
    { id:"gravy",     name:"Gravy",                 emoji:"🥣", slots:1 },
    { id:"greenbean", name:"Green Bean Casserole",  emoji:"🫛", slots:1 },
    { id:"mac",       name:"Mac & Cheese",          emoji:"🧀", slots:1 },
    { id:"cheesypotatos",      name:"Cheesy Potato's",          emoji:"🍠", slots:1 },
    { id:"spritecranberry", name:"Sprite Cranberry",       emoji:"🍒", slots:1 },
    { id:"rolls",     name:"Dinner Rolls",          emoji:"🥖", slots:1 },
    { id:"chocolatepie",     name:"Chocolate Creme Pie",emoji:"🍫", slots:1 },
    { id:"pumpkin",   name:"Pumpkin Pie",           emoji:"🥧", slots:1 },
    { id:"applepie",  name:"Apple Pie",             emoji:"🍎", slots:1 },
    { id:"drinks",    name:"Soda",                emoji:"🥤", slots:2 },
    { id:"alcohol",      name:"Alcohol",                  emoji:"🍷", slots:12 },
    { id:"ice",       name:"Ice",                   emoji:"🧊", slots:3 },
    { id:"plates",    name:"Festive Napkins",   emoji:"🍽️", slots:1 },
  ]
};

/* =====================================================================
   Game engine — no need to edit below unless you want to
   ===================================================================== */
const $ = s => document.querySelector(s);
const G = CONFIG.GUARD_NAME;
const GU = G.toUpperCase();
const state = { name:"", selected:new Set(), writeIn:"", seating:"", claims:{} };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Pixel sprites (half rows are mirrored) ---------- */
function sprite(rows, pal, mirror = true) {
  const full = rows.map(r => mirror ? (r = r.padEnd(12, ".").slice(0, 12)) + [...r].reverse().join("") : r);
  const w = Math.max(...full.map(r => r.length)), h = full.length;
  let out = "";
  full.forEach((r, y) => [...r.padEnd(w, ".")].forEach((c, x) => {
    if (pal[c]) out += `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${pal[c]}"/>`;
  }));
  return `<svg class="px" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">${out}</svg>`;
}
const PAL = { k:"#2b1d1d", s:"#f4c7a1", S:"#d99b73", w:"#ffffff",

/* ---------- Sound ---------- */
let actx = null, muted = false;
function blip(f = 660, d = 0.03) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = f; g.gain.value = 0.025;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}
$("#mute").onclick = e => { e.stopPropagation(); muted = !muted; e.target.textContent = muted ? "♪ OFF" : "♪ ON"; };

/* ---------- Scenes, bars, toast ---------- */
function showScene(id, textbox = true) {
  document.querySelectorAll(".scene").forEach(s => s.classList.toggle("on", s.id === id));
  $("#textbox").classList.toggle("on", textbox);
}
function setBar(id, pct) {
  const el = $("#" + id); el.style.width = Math.max(0, pct) + "%";
  el.className = pct > 50 ? "" : pct > 20 ? "mid" : "low";
}
let toastT;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200);
}

/* ---------- Dialogue ---------- */
let finishTyping = null, advanceFn = null;
function say(who, text, opts = {}) {
  return new Promise(resolve => {
    const box = $("#textbox"), el = $("#txt"), sp = $("#speaker");
    sp.hidden = !who; sp.textContent = who || "";
    el.textContent = ""; box.classList.remove("ready");
    const chars = [...text]; let i = 0;
    const done = () => {
      clearInterval(timer); el.textContent = text; finishTyping = null;
      if (opts.noWait) { resolve(); return; }
      box.classList.add("ready");
      advanceFn = () => { advanceFn = null; box.classList.remove("ready"); blip(880, .04); resolve(); };
    };
    const timer = setInterval(() => {
      if (i >= chars.length) return done();
      el.textContent += chars[i];
      if (i % 2 === 0 && chars[i] !== " ") blip(who && who.toUpperCase() === GU ? 520 : 700);
      i++;
    }, opts.speed || 26);
    finishTyping = done;
  });
}
function advance() { if (finishTyping) finishTyping(); else if (advanceFn) advanceFn(); }
$("#stage").addEventListener("click", e => {
  if (e.target.closest("input,button,form,.paper,.menu")) return;
  if ($("#title").classList.contains("on")) return startGame();
  advance();
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if ($("#title").classList.contains("on") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); return startGame(); }
  if ($("#menu").classList.contains("on")) return menuKeys(e);
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); advance(); }
});

function askName() {
  return new Promise(resolve => {
    const f = $("#nameForm"), inp = $("#nameInput");
    f.hidden = false; inp.value = state.name || ""; setTimeout(() => inp.focus(), 60);
    f.onsubmit = e => {
      e.preventDefault();
      const v = inp.value.trim().replace(/\s+/g, " ").slice(0, 24);
      if (!v) { inp.classList.add("shake"); setTimeout(() => inp.classList.remove("shake"), 400); return; }
      f.hidden = true; blip(990, .08); inp.blur(); resolve(v);
    };
  });
}
function waitClick(btn) {
  return new Promise(resolve => { btn.hidden = false; btn.onclick = e => { e.stopPropagation(); btn.hidden = true; blip(990, .06); resolve(); }; });
}
function joinList(a) { return a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1]; }

/* ---------- Backend ---------- */
async function loadClaims() {
  if (!CONFIG.SUBMIT_URL) {
    try { state.claims = JSON.parse(localStorage.getItem("tq_demo_claims") || "{}"); } catch (e) {}
    return;
  }
  try {
    const r = await fetch(CONFIG.SUBMIT_URL + "?action=claims", { cache: "no-store" });
    const j = await r.json(); state.claims = j.claims || {};
  } catch (e) { console.warn("Couldn't load claims", e); }
}
async function submit() {
  const items = [...state.selected];
  const payload = {
    name: state.name, items,
    itemNames: items.map(id => CONFIG.ITEMS.find(i => i.id === id).name),
    writeIn: state.writeIn, seating: state.seating, ts: new Date().toISOString()
  };
  if (!CONFIG.SUBMIT_URL) {
    // demo mode: remember claims locally so you can test the "taken" display
    try {
      const c = JSON.parse(localStorage.getItem("tq_demo_claims") || "{}");
      for (const k in c) c[k] = c[k].filter(n => n.toLowerCase() !== state.name.toLowerCase());
      items.forEach(id => (c[id] = c[id] || []).push(state.name));
      localStorage.setItem("tq_demo_claims", JSON.stringify(c));
    } catch (e) {}
    return { ok: true, demo: true };
  }
  try {
    await fetch(CONFIG.SUBMIT_URL, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    return { ok: true };
  } catch (e) { return { ok: false, error: e }; }
}

/* =====================================================================
   STORY
   ===================================================================== */
let started = false;
function startGame() {
  if (started) return; started = true;
  blip(523, .08); setTimeout(() => blip(784, .12), 90);
  loadClaims();
  scene1();
}

/* Scene 1 — the front-door showdown */
async function scene1() {
  showScene("battle");
  const b = $("#battle"); b.classList.remove("entered"); void b.offsetWidth; b.classList.add("entered");
  $("#held").innerHTML = ""; $("#playerName").textContent = state.name || "???";
  setBar("patBar", 100); setBar("hungerBar", 90); $("#hpText").textContent = "ITEMS: 0";
  $("#txt").textContent = ""; $("#speaker").hidden = true;
  await sleep(950);
  const aunt = $("#auntSpr");

  await say(null, `A wild ${GU} appeared at the front door!`);
  await say(G, `Well, well, WELL. Look who finally decided to show up!`);
  await say(G, `Hold on now... who ARE you? Speak up, sweetie. My hearing aid's on the fritz.`, { noWait: true });
  state.name = await askName();
  const N = state.name;
  $("#playerName").textContent = N; $("#playerLv").textContent = "Lv" + (10 + N.length);

  await say(G, `${N}! Of course! My favorite. Don't tell the others.`);
  await say(N, `${G}! I've been counting down the days. Everybody under one roof again!`);
  await say(G, `Oh, me too, sweetheart. The noise. The hugs. Uncle Ray asleep in his recliner by 4:15...`);
  await say(N, `Grandma's laugh! The game on way too loud! The kids' table chaos! I can't WAIT.`);
  await say(G, `It's going to be so wonderful having the whole family together again.`);
  await say(G, `...`, { speed: 220 });
  $("#bang").classList.add("on"); blip(300, .15); setBar("patBar", 60);
  await say(G, `So.`, { speed: 120 });
  $("#bang").classList.remove("on");
  aunt.classList.add("shake"); setTimeout(() => aunt.classList.remove("shake"), 450);
  setBar("patBar", 35); blip(180, .2);
  await say(G, `What the hell are you even bringing?`);
  await say(N, `...Bringing?`);
  await say(null, `${N.toUpperCase()} used PLAYING DUMB!\nIt's not very effective...`);
  setBar("patBar", 8); blip(140, .25);
  await say(null, `${GU}'s PATIENCE is dangerously low!`);
  await say(G, `Don't you "bringing?" me. Here. Take the list. Circle what you're bringing, and I mean it.`);
  scene2();
}

/* Scene 2 — first-person list */
function scribble() {
  const pts = [], n = 30, start = Math.random() * Math.PI * 2, turns = 1.12;
  for (let i = 0; i <= n; i++) {
    const t = start + (i / n) * Math.PI * 2 * turns;
    const j = 1 + (Math.random() - .5) * .05, drift = i / n * 3;
    pts.push([(50 + Math.cos(t) * (47 + drift) * j).toFixed(1), (50 + Math.sin(t) * (44 - drift) * j).toFixed(1)]);
  }
  return "M" + pts.map(p => p.join(" ")).join(" L");
}
function renderList() {
  const ul = $("#itemList"); ul.innerHTML = "";
  CONFIG.ITEMS.forEach(it => {
    const others = (state.claims[it.id] || []).filter(n => n.toLowerCase() !== state.name.toLowerCase());
    const full = others.length >= (it.slots || 1);
    const li = document.createElement("li");
    li.className = "item" + (full ? " taken" : "");
    li.innerHTML = `<span class="em"></span><span class="lbl"></span>${it.slots > 1 ? `<span class="slots">(need ${it.slots})</span>` : ""}<span class="by"></span>`;
    li.querySelector(".em").textContent = it.emoji;
    li.querySelector(".lbl").textContent = it.name;
    if (others.length) li.querySelector(".by").textContent = (full ? "taken — " : "+ ") + others.join(", ");
    li.onclick = () => {
      if (full) { blip(150, .15); toast(`${others.join(" & ")} already called it!`); return; }
      toggleItem(it.id, li);
    };
    ul.appendChild(li);
    if (state.selected.has(it.id)) addCircle(li);
  });
  updateCount();
}
function addCircle(li) {
  li.insertAdjacentHTML("beforeend",
    `<svg class="circ" viewBox="0 0 100 100" preserveAspectRatio="none"><path pathLength="1" vector-effect="non-scaling-stroke" d="${scribble()}"/></svg>`);
}
function toggleItem(id, li) {
  if (state.selected.has(id)) { state.selected.delete(id); li.querySelector("svg.circ")?.remove(); blip(400, .05); }
  else { state.selected.add(id); addCircle(li); blip(760, .05); setTimeout(() => blip(980, .05), 60); }
  updateCount();
}
function updateCount() {
  const n = state.selected.size + (($("#writeIn").value || "").trim() ? 1 : 0);
  $("#selCount").textContent = n + " CIRCLED";
}
$("#writeIn").addEventListener("input", updateCount);

async function scene2() {
  showScene("list", false);
  await loadClaims();
  renderList();
}
$("#doneBtn").onclick = e => {
  e.stopPropagation();
  state.writeIn = $("#writeIn").value.trim();
  if (!state.selected.size && !state.writeIn) {
    blip(150, .2); $("#paper").classList.add("shake");
    setTimeout(() => $("#paper").classList.remove("shake"), 450);
    toast(`${G}: "Oh no you don't. Circle SOMETHING."`);
    return;
  }
  scene3();
};

/* Scene 3 — back at the door, arms full */
async function scene3() {
  showScene("battle");
  const N = state.name;
  const picks = CONFIG.ITEMS.filter(i => state.selected.has(i.id));
  const names = picks.map(i => i.name.toUpperCase());
  if (state.writeIn) names.push(state.writeIn.toUpperCase());
  const held = $("#held"); held.innerHTML = "";
  setBar("patBar", 8);
  $("#txt").textContent = ""; $("#speaker").hidden = true;

  await say(null, `${N.toUpperCase()} handed the list back to ${GU}.`);
  [...picks.map(p => p.emoji), ...(state.writeIn ? ["🎁"] : [])].forEach((em, i) => {
    setTimeout(() => {
      const s = document.createElement("span"); s.textContent = em; held.appendChild(s); blip(600 + i * 60, .05);
    }, i * 160);
  });
  $("#hpText").textContent = "ITEMS: " + names.length;
  await sleep(200);
  await say(null, `${N.toUpperCase()} is now carrying ${joinList(names)}!`);
  setBar("patBar", 100); setBar("hungerBar", 100);
  blip(523, .08); setTimeout(() => blip(659, .08), 90); setTimeout(() => blip(784, .14), 180);
  await say(null, `${GU}'s PATIENCE was fully restored!`);
  await say(G, `Well. I am glad you did not come empty handed today like you always do.`);
  await say(N, `...That was ONE time.`);
  await say(G, `It was four times. Go on, get in here. And wipe your feet.`, { noWait: true });
  await waitClick($("#walkBtn"));
  scene4();
}

/* Scene 4 — inside: choose your destiny */
let menuIdx = 0, menuResolve = null;
function menuButtons() { return [...document.querySelectorAll("#menu button")]; }
function setMenu(i) { menuIdx = (i + 3) % 3; menuButtons().forEach((b, k) => b.classList.toggle("sel", k === menuIdx)); }
let menuOpenedAt = 0;
function menuKeys(e) {
  if (e.key === "ArrowDown") { e.preventDefault(); setMenu(menuIdx + 1); blip(700, .03); }
  if (e.key === "ArrowUp") { e.preventDefault(); setMenu(menuIdx - 1); blip(700, .03); }
  if (e.key === "Enter" && Date.now() - menuOpenedAt > 500) { e.preventDefault(); pickMenu(menuIdx); }
}
function pickMenu(i) {
  if (!menuResolve) return;
  $("#menu").classList.remove("on"); blip(990, .08);
  const r = menuResolve; menuResolve = null; r(menuButtons()[i].dataset.v);
}
menuButtons().forEach((b, i) => {
  b.onmouseenter = () => setMenu(i);
  b.onclick = e => { e.stopPropagation(); pickMenu(i); };
});
function menu() { return new Promise(r => { menuResolve = r; menuOpenedAt = Date.now(); setMenu(0); $("#menu").classList.add("on"); }); }

async function scene4() {
  showScene("inside");
  const N = state.name;
  $("#txt").textContent = ""; $("#speaker").hidden = true;
  await say(null, `The smell of turkey hits ${N.toUpperCase()} like a HYPER BEAM.`);
  await say(null, `Before you can even take your shoes off, you must choose your destiny...`, { noWait: true });
  state.seating = await menu();

  if (state.seating === "First Table") {
    await say(null, `${N.toUpperCase()} charges the FIRST TABLE!\nA critical hit on the mashed potatoes!`);
    await say(G, `Plate for Grandma FIRST. Then you. Manners!`);
  } else if (state.seating === "Second Round") {
    await say(null, `${N.toUpperCase()} waits for the SECOND ROUND.\nPatient. Strategic. Terrifying.`);
    await say(G, `Smart. The gravy's always better the second time around.`);
  } else {
    await say(null, `${N.toUpperCase()} grabs a DOGGIE BAG and heads straight for the exit!`);
    await say(null, `The whole family is filled with RAGE!\nIt's super effective!`);
    await say(G, `You walked in FOUR SECONDS AGO!`);
  }
  await say(null, `Saving your quest...`, { noWait: true });
  scene5();
}

/* Scene 5 — results card */
async function scene5() {
  const res = await submit();
  showScene("done", false);
  const picks = CONFIG.ITEMS.filter(i => state.selected.has(i.id)).map(i => `${i.emoji} ${i.name}`);
  if (state.writeIn) picks.push("🎁 " + state.writeIn);
  $("#cName").textContent = state.name;
  $("#cItems").innerHTML = ""; picks.forEach(p => { const d = document.createElement("div"); d.textContent = p; $("#cItems").appendChild(d); });
  $("#cSeat").textContent = state.seating;
  $("#cStatus").textContent = res.demo
    ? "DEMO MODE: saved in this browser only. Add your SUBMIT_URL in index.html to collect everyone's answers."
    : res.ok ? `SAVED! ${G} has your name on the list. See you on Thanksgiving, ${state.name}!`
             : "Hmm, couldn't reach the family list. Check your internet and try again.";
}
$("#againBtn").onclick = e => { e.stopPropagation(); started = true; scene2(); };
